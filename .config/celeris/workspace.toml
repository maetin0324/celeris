# このリポジトリ（agent-platform / Celeris 本体）の作業場所の設定（ADR-0042 D2 / ADR-0043 D4）。
# 書き方は docs/guides/workspace.md。**書いてあることだけ**が使われる（言語やファイル構成からの推定はしない）。

[workspace]
name = "agent-platform"
description = "Celeris（celeris / celerisctl / GUI）本体。Rust のワークスペース + web/ の SPA と gateway"

[run]
# ホスト実行のまま（コンテナ実行は ADR-0043 A3 の工事。この Phase では読むだけ）。
mode = "host"

[commands]
# 実装者とレビュー担当が使う検査コマンド（CLAUDE.md の「各Phase完了時に必ず」と同じ 3 本）。
# タスクに `acceptance` の検査コマンドが明示されていればそちらが勝つ。
# 試験は変更 crate と逆依存 crate だけ（scripts/dev/test-affected.sh。web だけの変更は web の unit 試験）。
# 全体の試験（workspace 全体の試験・web e2e・本物の browser/userns）は release gate だけ
# （agent-docs/adr/2026-10-20-full-tests-at-release-only.md）。
check = ["bash scripts/dev/test-affected.sh", "cargo clippy --workspace -- -D warnings", "cargo fmt --all -- --check"]

[outputs]
# 文書ページの根。図・表・原稿のような「コード以外の成果物」はリポジトリのルート基準（既定）。
docs = "docs"
