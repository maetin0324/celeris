[workspace]
resolver = "2"
members = [
    "crates/campaign",
    "crates/celeris-credentiald",
    "crates/task-core",
    "crates/task-ops",
    "crates/task-api",
    "crates/task-worker",
    "crates/task-dispatch",
    "crates/routing-eval",
    "crates/llm-proxy",
    "crates/jev-classifier",
    "crates/celeris-mcp",
    "crates/celeris",
    "crates/celerisctl",
    "tests/e2e",
]
exclude = ["examples/hello-crate"]

[workspace.package]
edition = "2024"

# ADR 2026-10-19-dev-profile-debuginfo: dev/test の debuginfo を減らして target を小さくする。release は既定のまま。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0
