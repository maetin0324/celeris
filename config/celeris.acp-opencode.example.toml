# ACP アダプタ（ADR-0026）の設定例。最初の実装は opencode（`opencode acp` が stdio 上の JSON-RPC で動く）を
# 使って OpenAI 互換の LLM（ローカル vLLM / llama.cpp 等）をワーカーに使う。相対パスはこのファイルのある
# ディレクトリ基準。
#
# 前提: PATH 上に opencode があること（`opencode acp` が動くこと）。opencode 側の設定ファイル（下の env の
# OPENCODE_CONFIG が指す先）は config/opencode.openai-compat.example.json をコピーして書き換える。そこで
# OpenAI 互換プロバイダ（`npm = "@ai-sdk/openai-compatible"`, `options.baseURL`）と既定モデル、権限を決める。
#
# 冷スタートの暖気（ADR-0026 D6）: 初回起動は opencode 側がプロバイダの npm パッケージ
# （`@ai-sdk/openai-compatible`）を取得するのに数分かかる（2 回目以降は数秒）。デーモンに載せる前に一度、
#   celerisctl worker run --config config/celeris.acp-opencode.example.toml --task <id> --harness opencode
# で 1 回実行して暖めておく。`startup_timeout_secs`（既定 300 秒）はこの初回取得を待てるように長めにしてある。

db = "../celeris-acp-demo.sqlite3"
workspace_root = "../workspaces"
tick_ms = 2000
max_concurrency = 1
lease_grace_secs = 60
idle_timeout_secs = 300
kill_grace_secs = 10
review_timeout_secs = 600
error_cooldown_secs = 300

[plan]
auto_accept = false

# `[adapters.acp]` は共通設定（ADR-0026 D2）。`command`/`args` は `[harnesses.<id>]` の宣言で上書きできる
# （別の ACP エージェント、例えば `goose acp` を同居させるときは harness 宣言を増やすだけでよい）。
[adapters.acp]
# command = "opencode"          # 既定。PATH 上の opencode を使うなら省略可
# args = ["acp"]                # 既定
permission = "allow"            # session/request_permission への即答（"allow" | "deny"。既定 "allow"）。
                                 # celeris は対話できず、ワークスペースは使い捨ての作業ディレクトリなので既定 allow
model_option_id = "model"       # session/set_config_option の configId（既定 "model"。opencode 1.18.31 で
                                 # 実機確認済み。opencode は optionId だと -32602 Invalid params を返す）
startup_timeout_secs = 300      # initialize の応答を待つ上限。初回のプロバイダ取得で数分かかりうる

# LLM source: ローカルの OpenAI 互換の供給元（Qwen の tunnel など）。model は具体的な ID で書く
# （tier alias の `celeris/cheap` は廃止された）。
[llm_sources.qwen]
kind = "openai_compatible"
api_format = "openai_compatible"
endpoint = "http://127.0.0.1:18000/v1"
models = ["qwen3.8-27b"]
# この供給元の同時 run 上限。ローカルの LLM（GPU 1 枚の Qwen）なら 1 のまま。
max_runs = 1

# harness: opencode の ACP 起動。
[harnesses.opencode]
kind = "acp"
api_formats = ["openai_compatible"]
source_kinds = ["openai_compatible"]
capabilities = ["tools", "repo"]
command = "opencode"
args = ["acp"]

# 候補は優先順。供給元に届かないときは次の候補へ（ここには 1 つだけ）。
[route_defaults.opencode]
candidates = [{ source = "qwen", model = "qwen3.8-27b" }]

# 注意（未解決。ADR 2026-10-11 の harness 宣言に欄がまだ無い）:
#   - OPENCODE_CONFIG（celeris が用意した opencode の設定ファイル）と OPENCODE_DISABLE_PROJECT_CONFIG=1 は
#     harness 宣言の env では渡せない。OPENCODE_DISABLE_PROJECT_CONFIG=1 は**必ず**渡すこと（ADR-0026 D6）。
#     渡す手段が入るまでは、opencode の既定の設定ファイルをワークスペースに置かない運用にする。
#   - 上の供給元のエンドポイントは opencode 側の設定（opencode.openai-compat.example.json）とも一致させる。

# OPENCODE_CONFIG が指す opencode 側の設定ファイル（config/opencode.openai-compat.example.json）では:
#   - OpenAI 互換プロバイダを `provider.<name>.npm = "@ai-sdk/openai-compatible"` /
#     `provider.<name>.options.baseURL = "http://<host>:<port>/v1"` で定義する
#   - `permission.task = "deny"` にして opencode 自身のサブエージェント委譲を止める。仕事の分割は celeris の
#     `delegate.json` → 子タスクだけで行う（SQLite に残り `celerisctl replay` で再構成できる。ADR-0026 D6 /
#     ADR-0016）
#   - `read` / `edit` / `bash` / `grep` / `glob` はワークスペースが使い捨てなので許可してよい
