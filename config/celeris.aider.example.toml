# aider アダプタ（ADR-0061）の設定例。明確で局所的な少数ファイル修正向けのハーネス。相対パスは
# このファイルのあるディレクトリ基準。
#
# 前提: PATH 上に aider（`pip install aider-chat` / `uv tool install aider-chat`）があること。
# API キーは harness の env ではなく、source の credential（credential_ref・アカウント画面の秘密ストア）で渡す。

db = "../celeris-aider-demo.sqlite3"
workspace_root = "../workspaces"
tick_ms = 2000
max_concurrency = 1
lease_grace_secs = 60
idle_timeout_secs = 300
kill_grace_secs = 10
review_timeout_secs = 600
error_cooldown_secs = 300

[plan]
auto_accept = false

# `[adapters.aider]` は共通設定（ADR-0061）。harness 宣言の `command`/`args` がこれを上書きする。
[adapters.aider]
# command = "aider"           # 既定。PATH 上の aider を使うなら省略可
# extra_args = []              # --message の前に追加する引数（例: ["--architect"]）

# LLM source と harness（ADR 2026-10-11 llm-source-harness-selection）。model は route の選択で決まる。
[llm_sources.anthropic_api]
kind = "anthropic_api"
api_format = "anthropic"
credential_ref = "anthropic-api-key"
models = ["claude-sonnet-5-5"]

[harnesses.aider]
kind = "aider"
api_formats = ["anthropic"]
source_kinds = ["anthropic_api"]
capabilities = ["repo"]

[route_defaults.aider]
candidates = [{ source = "anthropic_api", model = "claude-sonnet-5-5" }]
