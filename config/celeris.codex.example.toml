# Phase 6 ドッグフーディング用の設定例（ADR-0008）。相対パスはこのファイルのあるディレクトリ基準。
# 使い方は agent-docs/PROGRESS.md の Phase 6 節「人間による確認待ち」を参照。
db = "../celeris-phase6-demo.sqlite3"
workspace_root = "../workspaces"
tick_ms = 2000
max_concurrency = 1
lease_grace_secs = 60
idle_timeout_secs = 120           # codex も無出力（考え中）が長く続きうるので余裕を持たせる
kill_grace_secs = 10
review_timeout_secs = 600
error_cooldown_secs = 300

[plan]
auto_accept = false

[adapters.codex]
# command = "codex"                   # PATH 上の codex を使うなら省略可
# extra_args = []                     # サンドボックス／承認モードのフラグはここで指定する（ADR-0008 D3）
# model = "gpt-5-codex"                # 省略時は codex の既定モデル（route の model は別に決まる）
# ADR-0054 D1（Phase 67）: 継続セッション（ノードごとの `node_sessions`。CoS の対話・部門長のレビュー run）
# を続ける手段。既定 "exec_resume"（`codex exec resume <id>`）。インストール済みの codex CLI がそれに
# 対応していなければ "experimental_resume"（`-c experimental_resume=<path>`）に上書きする。判定は
# バージョンプローブではなくこの設定フラグで決定的に行う（celeris/src/config.rs の `resolved_resume_mode`）。
# resume_mode = "exec_resume"

# LLM source（供給元）と harness（実行器）は別々に宣言する（ADR 2026-10-11 llm-source-harness-selection）。
[llm_sources.codex_oauth]
kind = "codex_oauth"
api_format = "openai_responses"
models = ["gpt-5-codex"]

[harnesses.codex]
kind = "codex"
api_formats = ["openai_responses"]
source_kinds = ["codex_oauth"]
capabilities = ["tools", "repo", "skills"]

[route_defaults.codex]
candidates = [{ source = "codex_oauth", model = "gpt-5-codex" }]
