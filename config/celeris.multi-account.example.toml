# 複数アカウント運用の設定例（ADR-0012 / ADR 2026-10-11 llm-source-harness-selection）。相対パスはこのファイルの
# あるディレクトリ基準。
#
# アカウントは供給元（llm_source）の下に置く。同じ供給元の複数アカウントは [accounts] の claude_dir / codex_dir の
# 下のディレクトリ（1 アカウント 1 ディレクトリ。GUI/API から追加・ログインできる）で管理し、celeris 自身が残量を見て
# 空いているアカウントを選ぶ。アカウントごとの上限は `max_runs` で書く（同じ source/account の組の admission）。
#
# 事前準備（アカウントごとに 1 回）: 次のようにして各ディレクトリで login する（GUI の「アカウントを追加」でも作れる）。
#   CLAUDE_CONFIG_DIR=/home/USER/.claude-accounts/a claude     # 起動して /login でアカウント A にログイン
#   CLAUDE_CONFIG_DIR=/home/USER/.claude-accounts/b claude     # 同じくアカウント B
#   CODEX_HOME=/home/USER/.codex-accounts/a codex login
# 動作確認はデーモンを使わずに: celerisctl --db <db> worker run --config <この設定> --task <id> --workspace <コピー>
#
# 注意: ワーカーは celeris 自身の環境変数を引き継ぐ。celeris を起動する環境に ANTHROPIC_API_KEY / OPENAI_API_KEY 等があると、
# アカウントのログインより優先されて全アカウントが同じ認証になりうるので、外してから起動すること。
db = "../celeris.sqlite3"
workspace_root = "../workspaces"
tick_ms = 2000
max_concurrency = 4
lease_grace_secs = 60
idle_timeout_secs = 300
kill_grace_secs = 10
review_timeout_secs = 600
error_cooldown_secs = 300
retry_backoff_base_secs = 10
retry_backoff_max_secs = 300
max_requeues = 5

[plan]
auto_accept = false

[reviewer]
# tier（reviewer の tier は廃止。route の候補で選ぶ）

# 全アカウント共通の設定。
[adapters.claude_code]
# permission_mode = "bypassPermissions"

[adapters.codex]
# extra_args = []

[accounts]
# 相対ならこのファイル基準。各 <id>/ が 1 アカウント。
claude_dir = "claude-accounts"
codex_dir = "codex-accounts"

# 供給元。accounts は上の [accounts] の下のディレクトリ名。max_runs は 1 アカウントあたりの同時 run 上限。
[llm_sources.claude_oauth]
kind = "claude_oauth"
api_format = "anthropic"
accounts = ["a", "b"]
max_runs = 2
models = ["claude-sonnet-5-5"]

[llm_sources.codex_oauth]
kind = "codex_oauth"
api_format = "openai_responses"
accounts = ["a"]
max_runs = 1
models = ["gpt-5-codex"]

[harnesses.claude_code]
kind = "claude_code"
api_formats = ["anthropic"]
source_kinds = ["claude_oauth"]
capabilities = ["tools", "repo", "skills"]

[harnesses.codex]
kind = "codex"
api_formats = ["openai_responses"]
source_kinds = ["codex_oauth"]
capabilities = ["tools", "repo", "skills"]

# 候補は優先順。先頭のアカウントが上限に達したら、同じ候補の次のアカウントへ行く。
[route_defaults.claude_code]
candidates = [{ source = "claude_oauth", model = "claude-sonnet-5-5" }]

[route_defaults.codex]
candidates = [{ source = "codex_oauth", model = "gpt-5-codex" }]
