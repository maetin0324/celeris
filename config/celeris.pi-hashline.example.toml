# coding 向けに Pi + Hashline を使う設定例（ADR 2026-10-07-coding-harness-default-pi-hashline）。
# 手順は docs/ops/coding-harness-pi-hashline.md。相対パスはこのファイルのあるディレクトリ基準。
#
# harness は task の内容（genre・requirements・能力・repo の有無）で選ばれ、LLM source と model は
# [route_defaults] の候補列の順で選ばれる。model family から harness を逆算する規則は無い。
# task が harness 欄に登録済みの ID を書けばそれが優先される。

[accounts]
opencode_dir = "~/.local/celeris/opencode-accounts"

# Claude Code（現状どおり）。
[llm_sources.claude_oauth]
kind = "claude_oauth"
api_format = "anthropic"
models = ["claude-sonnet-5"]

[harnesses.claude_code]
kind = "claude_code"
api_formats = ["anthropic"]
source_kinds = ["claude_oauth"]
capabilities = ["tools", "repo", "skills"]

# Pi + Hashline（opencode go の鍵を使う。codex / Claude の OAuth は Pi に渡せない）。
# Pi の実行ファイルは harness 宣言の command/args で指す（既定は PATH 上の pi）。
[llm_sources.opencode_go]
kind = "opencode_go"
api_format = "openai_compatible"
models = ["opencode-go/kimi-k3"]

[harnesses.pi]
kind = "pi"
api_formats = ["openai_compatible"]
source_kinds = ["opencode_go"]
capabilities = ["tools", "repo", "skills"]

# 候補は優先順。先頭から適格なものを選ぶ（適格性・quota・cooldown・同時実行数）。
[route_defaults.claude_code]
candidates = [{ source = "claude_oauth", model = "claude-sonnet-5" }]

[route_defaults.pi]
candidates = [{ source = "opencode_go", model = "opencode-go/kimi-k3" }]

# harness の選択規則（genre・repo の有無から決める。一意に決まらなければ fail closed）。
[harness_selection]
rules = [
  { genre = "coding", required_capabilities = [], requires_repo = true, harness = "pi" },
]
# execution class ごとの harness の候補（優先順）。宣言した class の run は genre・role の規則を見ず、
# この順に harness を試す。各 harness は route_defaults の source×model を admission にかけ、最初に通った組で起動する。
# 全て埋まっていれば defer（失敗にしない）。宣言の無い class は上の rules で選ぶ。
# planner は claude_code が埋まると pi（opencode go）へ回る。reviewer は claude_code だけを試す（埋まれば defer）。
execution_class_defaults = { planner = ["claude_code", "pi"], review = ["claude_code"] }
