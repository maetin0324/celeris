[package]
name = "celeris-campaign"
version = "0.1.0"
edition.workspace = true

[lib]
name = "celeris_campaign"
path = "src/lib.rs"

[[bin]]
name = "celeris-campaign"
path = "src/main.rs"

[dependencies]
routing-eval = { path = "../routing-eval" }
task-core = { path = "../task-core" }
task-worker = { path = "../task-worker" }
task-dispatch = { path = "../task-dispatch" }
async-trait = "0.1"
tokio = { version = "1.53.1", features = ["rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tempfile = "3"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
# ops-r1-trace: 測定 daemon の DB の写しを読み取り専用で開く（migration を走らせない）。
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
task-api = { path = "../task-api" }
task-ops = { path = "../task-ops" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query", "multipart"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
