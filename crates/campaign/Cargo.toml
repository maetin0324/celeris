[package]
name = "celeris-campaign"
version = "0.1.0"
edition.workspace = true

[lib]
name = "celeris_campaign"
path = "src/lib.rs"

[[bin]]
name = "celeris-campaign"
path = "src/main.rs"

[dependencies]
routing-eval = { path = "../routing-eval" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
task-core = { path = "../task-core" }
task-api = { path = "../task-api" }
task-ops = { path = "../task-ops" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query", "multipart"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
rusqlite = { version = "0.32", features = ["bundled"] }
