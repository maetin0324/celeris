[package]
name = "celeris-credentiald"
version = "0.1.0"
edition.workspace = true

[dependencies]
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
getrandom = "0.2"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
