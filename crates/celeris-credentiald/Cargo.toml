[package]
name = "celeris-credentiald"
version = "0.1.0"
edition.workspace = true

[dependencies]
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
getrandom = "0.2"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
task-core = { path = "../task-core" }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
celeris-credentiald = { path = ".", features = ["same-uid-harness"] }

[features]
# ADR-0109 D6: test-only admission (runtime facts whose only violation is
# SameUid). Never enabled by default or in release builds.
same-uid-harness = []
