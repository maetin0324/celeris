[package]
name = "celerisctl"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "celerisctl"
path = "src/main.rs"

[dependencies]
task-core = { path = "../task-core" }
task-ops = { path = "../task-ops" }
task-worker = { path = "../task-worker" }
task-dispatch = { path = "../task-dispatch" }
celeris-mcp = { path = "../celeris-mcp" }
celeris = { path = "../celeris" }
clap = { version = "4", features = ["derive", "env"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "signal"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# ADR-0095 D6: 試験で `schema_migrations` を古い／新しい版に書き換える。
rusqlite = { version = "0.32", features = ["bundled"] }
# ADR 2026-11-22-external-llm-discussion-exchange D7.1: `tests/rdc_celeris_chat.rs` が試験の MCP server を別 thread の runtime で動かし、
# 本体の thread で `scripts/rdc/celeris-chat` を同期に実行する。
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
