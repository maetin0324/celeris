[package]
name = "jev-classifier"
version = "0.1.0"
edition.workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "charset", "http2", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["time", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "test-util"] }
