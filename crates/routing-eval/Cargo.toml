[package]
name = "routing-eval"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "celeris-routing-eval"
path = "src/main.rs"

[dependencies]
task-core = { path = "../task-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "blocking"] }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
