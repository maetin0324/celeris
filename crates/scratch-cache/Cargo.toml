[package]
name = "scratch-cache"
version = "0.1.0"
edition.workspace = true

# ADR-0075 D5 (b)（Phase G3）: sccache の webdav backend に対する階層 cache（L1 = ローカル、L2 = NFS）と、
# それを loopback で出す WebDAV のサブセット（`celeris cache-server`）。
[dependencies]
task-ops = { path = "../task-ops" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "net", "macros", "sync", "time"] }
zstd = "0.13"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
