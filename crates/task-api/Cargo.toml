[package]
name = "task-api"
version = "0.1.0"
edition.workspace = true

[dependencies]
task-core = { path = "../task-core" }
task-ops = { path = "../task-ops" }
celeris-credentiald = { path = "../celeris-credentiald" }
async-trait = "0.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query", "multipart"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
tempfile = "3"
tokio = { version = "1.53.1", features = ["sync", "time", "net", "rt", "macros", "fs", "io-util"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
http-body-util = "0.1"
form_urlencoded = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "0.9"
tracing = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }
ulid = "1"
# ADR-0080 D5: GUI の human attestation（Ed25519）の検証と、手動登録の秘密の zeroize。
ring = "0.17"
zeroize = "1"

[dev-dependencies]
task-worker = { path = "../task-worker", features = ["h3-e2e-insecure-cert", "same-uid-harness", "attack-test-hooks"] }
celeris-credentiald = { path = "../celeris-credentiald", features = ["same-uid-harness"] }
async-trait = "0.1"
tempfile = "3"
base64 = "0.22"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "test-util"] }
syn = { version = "2", features = ["full", "visit"] }
