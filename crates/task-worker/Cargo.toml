[package]
name = "task-worker"
version = "0.1.0"
edition.workspace = true

[dependencies]
task-core = { path = "../task-core" }
celeris-credentiald = { path = "../celeris-credentiald" }
zeroize = "1"
url = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread", "fs", "net"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
# `fs` は ADR-0032 の TOTP 中継で使う `mkfifo` と `OFlag::O_NONBLOCK` のため。
nix = { version = "0.30", features = ["signal", "process", "fs", "user"] }
time = { version = "0.3", features = ["serde", "formatting"] }

[dev-dependencies]
tempfile = "3"
celeris-credentiald = { path = "../celeris-credentiald", features = ["same-uid-harness"] }
