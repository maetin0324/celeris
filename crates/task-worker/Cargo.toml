[package]
name = "task-worker"
version = "0.1.0"
edition.workspace = true

[features]
# Test fixture only: permit a self-signed HTTPS certificate inside a private netns.
h3-e2e-insecure-cert = []
# Test fixture only: ADR-0089 A1 hook that retargets the page between the controller's
# checks and the broker's CDP command. Enabled by this crate's own dev-dependency.
attack-test-hooks = []
# ADR-0094 D2: test-only restore admission (runtime facts whose only violation
# is SameUid). Never enabled by default or in release builds.
same-uid-harness = []

[dependencies]
task-core = { path = "../task-core" }
celeris-credentiald = { path = "../celeris-credentiald" }
zeroize = "1"
url = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread", "fs", "net"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
base64 = "0.22"
# `fs` は ADR-0032 の TOTP 中継で使う `mkfifo` と `OFlag::O_NONBLOCK` のため。
nix = { version = "0.30", features = ["signal", "process", "fs", "user"] }
time = { version = "0.3", features = ["serde", "formatting"] }

[dev-dependencies]
tempfile = "3"
celeris-credentiald = { path = "../celeris-credentiald", features = ["same-uid-harness"] }
task-worker = { path = ".", features = ["attack-test-hooks", "same-uid-harness"] }
task-api = { path = "../task-api" }
