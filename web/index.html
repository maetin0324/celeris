<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Celeris</title>
    <!-- ホーム画面に置くための manifest と icon（ADR 2026-10-28-web-https-front-pwa D2）。service worker は無い。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#245675" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Celeris" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root">
      <!-- 起動に失敗したときの静的な案内（P2-02）。起動できれば React が置き換える。CSP のため inline script は使わない。 -->
      <main style="max-width: 32rem; margin: 0 auto; padding: 1.5rem; font-family: sans-serif">
        <h1>Celeris を起動しています</h1>
        <p>表示が変わらない場合は、再読み込みしてください。直らないときは gateway（celeris-web）の起動状態とブラウザの JavaScript の設定を確かめてください。</p>
        <p><a href="/login" style="display: inline-block; min-height: 44px; min-width: 44px; line-height: 44px">ログイン画面を開く</a></p>
      </main>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
